services:
  - type: web
    name: dream-studio-v2
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3-flash-preview
      - key: AI_MAX_CONCURRENT
        value: "3"
      - key: ADMIN_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
